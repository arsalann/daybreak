name: Daybreak
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Daybreak:
    type: application
    platform: iOS
    sources:
      - Daybreak
    info:
      path: Daybreak/Info.plist
      properties:
        NSAlarmKitUsageDescription: Daybreak schedules the wake-up alarms you create so they ring even in Silent mode or Focus.
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        UIBackgroundModes: [fetch]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).daybreak
        INFOPLIST_KEY_CFBundleDisplayName: Daybreak
  DaybreakSpike:
    type: application
    platform: iOS
    sources:
      - Spike
      - Daybreak/Generation
    info:
      path: Spike/Info.plist
      properties:
        NSAlarmKitUsageDescription: The Daybreak M0 spike schedules test alarms to check AlarmKit reliability.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).daybreak.spike
        INFOPLIST_KEY_CFBundleDisplayName: Daybreak M0
  DaybreakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DaybreakTests
    dependencies:
      - target: Daybreak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).daybreak.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Daybreak:
    build:
      targets:
        Daybreak: all
        DaybreakTests: [test]
    test:
      targets:
        - DaybreakTests
  DaybreakSpike:
    build:
      targets:
        DaybreakSpike: all
